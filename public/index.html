<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAKO MD 🦋 - Pair Code</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --rgb-speed: 16s;
    --glass-bg: rgba(0, 0, 0, 0.85);
    --border-glow: rgba(255, 255, 255, 0.08);
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Poppins', sans-serif;
    background: #0a0a0f;
    color: #fff;
    padding: 20px;
    background-image: 
        radial-gradient(ellipse at 20% 50%, rgba(120, 80, 255, 0.05) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 50%, rgba(255, 80, 120, 0.05) 0%, transparent 60%);
}

.card {
    width: 90%;
    max-width: 420px;
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 28px;
    padding: 32px 24px 28px;
    text-align: center;
    border: 1px solid rgba(255, 255, 255, 0.06);
    box-shadow: 
        0 30px 80px rgba(0, 0, 0, 0.8),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
    transition: all 0.3s;
}

@keyframes rgbText {
    0% { background-position: 0% 50%; }
    100% { background-position: 400% 50%; }
}

.rgb-text {
    background: linear-gradient(90deg, 
        #ff4d6d, #ff8a4d, #ffd93d, #6bcb77, #4d96ff, #9b59ff, #ff4d6d
    );
    background-size: 400% 100%;
    animation: rgbText var(--rgb-speed) linear infinite;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

h1 {
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 2px;
}

h1:last-of-type {
    font-size: 1.6rem;
    margin-bottom: 4px;
}

.status {
    font-size: 0.75rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    opacity: 0.8;
    margin: 6px 0 16px 0;
    font-weight: 500;
}

@keyframes rgbMove {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
}

.rgb-box {
    padding: 3px;
    border-radius: 18px;
    background: linear-gradient(90deg, #ff4d6d, #ff8a4d, #ffd93d, #6bcb77, #4d96ff, #9b59ff, #ff4d6d);
    background-size: 300% 100%;
    animation: rgbMove 4s linear infinite;
    width: 100%;
    max-width: 340px;
    margin: 0 auto 16px auto;
    transition: all 0.3s;
    box-shadow: 0 0 30px rgba(155, 89, 255, 0.05);
}

.rgb-box input {
    width: 100%;
    border: none;
    outline: none;
    padding: 16px;
    border-radius: 16px;
    background: #0a0a0f;
    color: #fff;
    text-align: center;
    font-size: 1.05rem;
    font-family: 'Poppins', sans-serif;
}

.rgb-box input::placeholder {
    color: #555;
}

.rgb-btn {
    width: 100%;
    max-width: 340px;
    padding: 3px;
    border-radius: 18px;
    background: linear-gradient(90deg, #ff4d6d, #ff8a4d, #ffd93d, #6bcb77, #4d96ff, #9b59ff, #ff4d6d);
    background-size: 300% 100%;
    animation: rgbMove 4s linear infinite;
    border: none;
    cursor: pointer;
    display: block;
    margin: 0 auto;
    transition: all 0.3s;
}

.btn-inner {
    background: #0a0a0f;
    color: #fff;
    display: block;
    padding: 14px;
    border-radius: 16px;
    font-weight: 700;
    font-size: 1rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: all 0.3s;
}

.rgb-btn:hover {
    transform: scale(1.02);
    box-shadow: 0 10px 40px rgba(155, 89, 255, 0.2);
}

.rgb-btn:hover .btn-inner {
    background: #111118;
}

.result-box {
    width: 100%;
    max-width: 340px;
    margin: 16px auto 0;
    padding: 3px;
    border-radius: 18px;
    background: linear-gradient(90deg, #ff4d6d, #ff8a4d, #ffd93d, #6bcb77, #4d96ff, #9b59ff, #ff4d6d);
    background-size: 300% 100%;
    animation: rgbMove 5s linear infinite;
    display: none;
    box-shadow: 0 0 40px rgba(155, 89, 255, 0.05);
}

.result-inner {
    background: #0a0a0f;
    border-radius: 16px;
    padding: 16px;
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 1.1rem;
    font-weight: 600;
    text-align: center;
}

#codeBox {
    letter-spacing: 3px;
    color: #fff;
    cursor: pointer;
}

.badge-group {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-top: 15px;
}

.badge {
    padding: 4px 14px;
    border-radius: 30px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.05);
    font-size: 0.6rem;
    letter-spacing: 0.5px;
    color: #888;
    font-weight: 500;
}

@media (max-width: 480px) {
    .card { padding: 24px 16px; }
    h1 { font-size: 1.7rem; }
    h1:last-of-type { font-size: 1.4rem; }
}
</style>
</head>
<body>

<div class="card">

<h1 class="rgb-text">MAKO MD 🦋</h1>
<h1 class="rgb-text">PAIR CODE</h1>

<p class="status rgb-text">TYPE YOUR WHATSAPP NUMBER</p>

<!-- Input with RGB Border -->
<div class="rgb-box">
    <input type="text" id="number" placeholder="947xxxxxxxx">
</div>

<!-- Button with RGB Border -->
<button class="rgb-btn" onclick="getCode()">
    <span class="btn-inner">GET PAIR CODE</span>
</button>

<!-- Result Box with RGB Border -->
<div class="result-box" id="borderBox">
    <div class="result-inner" id="codeBox">----</div>
</div>

<!-- Footer Badges -->
<div class="badge-group">
    <span class="badge">🤖 WHATSAPP BOT</span>
    <span class="badge">⚡ MAKO MD</span>
    <span class="badge">✨ 2026</span>
</div>

<p class="status rgb-text" style="margin-top: 10px; font-size: 0.6rem;">MADE BY PODI MAKO · MINI BOT EDITION</p>

</div>

<script>
async function getCode() {
    const num = document.getElementById("number").value.replace(/[^0-9]/g, '');
    const codeBox = document.getElementById("codeBox");
    const borderBox = document.getElementById("borderBox");

    if (!num) {
        borderBox.style.display = "block";
        codeBox.style.letterSpacing = "normal";
        codeBox.style.color = "#ff4d6d";
        codeBox.innerText = "කරුණාකර අංකයක් ඇතුළත් කරන්න";
        return;
    }

    // Loading State
    borderBox.style.display = "block";
    codeBox.style.letterSpacing = "normal";
    codeBox.style.color = "#9b59ff";
    codeBox.innerText = "CONNECTING.....";

    try {
        const res = await fetch(`/pair?number=${num}`);
        const data = await res.json();
        
        if (data.code) {
            codeBox.style.letterSpacing = "3px";
            codeBox.style.color = "#00ff88";
            let formattedCode = data.code.includes('-') ? data.code : data.code.match(/.{1,4}/g)?.join('-') || data.code;
            codeBox.innerText = formattedCode;
        } else if (data.error) {
            codeBox.style.letterSpacing = "normal";
            codeBox.style.color = "#ff4d6d";
            codeBox.innerText = data.error;
        } else {
            codeBox.style.letterSpacing = "normal";
            codeBox.style.color = "#ff4d6d";
            codeBox.innerText = "SERVER ERROR";
        }
    } catch (e) {
        codeBox.style.letterSpacing = "normal";
        codeBox.style.color = "#ff4d6d";
        codeBox.innerText = "CONNECTION FAILED";
    }
}

document.getElementById("number").addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        e.preventDefault();
        getCode();
    }
});
</script>

</body>
    </html>
